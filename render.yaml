services:
  - type: web
    name: fiscalflow
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: fiscalflow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
