services:
  - type: web
    name: fiscalflow
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1024"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: JWT_SECRET
        generateValue: true
